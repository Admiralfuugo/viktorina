{% extends "base.html" %}
{% block title %}Parolni yangilash{% endblock %}
{% block content %}
<h1>Parolni yangilash</h1>
<p class="muted">Yangi parol panel bazasida saqlanadi va .env / Coolify'dagi PANEL_PASSWORD o'rniga ishlaydi.</p>
<div class="card" style="max-width:460px">
  <form method="post" action="/password">
    <label>Joriy parol</label>
    <input type="password" name="current" required autocomplete="current-password">
    <label>Yangi parol <span class="hint">— kamida 8 belgi</span></label>
    <input type="password" name="new" required minlength="8" autocomplete="new-password">
    <label>Yangi parolni takrorlang</label>
    <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
    <div style="margin-top:16px"><button type="submit">Saqlash</button></div>
  </form>
</div>
{% endblock %}
