<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Viktorina panel{% endblock %}</title>
<script>
  // Mavzuni sahifa chizilishidan oldin qo'llash (miltillamasligi uchun)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f6fb; --bg2:#e9edf8; --card:rgba(255,255,255,.72); --card-solid:#fff; --text:#141a2b; --muted:#667085;
    --line:rgba(20,26,43,.10); --input:rgba(255,255,255,.85);
    --accent:#6d5efc; --accent2:#22b8f0; --ok:#12a150; --err:#e5484d;
    --ok-bg:rgba(18,161,80,.12); --err-bg:rgba(229,72,77,.12); --win-bg:rgba(250,204,21,.18);
    --shadow:0 10px 30px -12px rgba(30,40,90,.18); --dot:109,94,252;
  }
  :root[data-theme="dark"] {
    --bg:#0b0e1a; --bg2:#121735; --card:rgba(22,27,52,.62); --card-solid:#161b34; --text:#e8ebff; --muted:#9aa3c7;
    --line:rgba(255,255,255,.09); --input:rgba(10,13,28,.6);
    --accent:#8b7dff; --accent2:#38d0ff; --ok:#3ddc84; --err:#ff6b70;
    --ok-bg:rgba(61,220,132,.13); --err-bg:rgba(255,107,112,.14); --win-bg:rgba(250,204,21,.13);
    --shadow:0 16px 40px -16px rgba(0,0,0,.6); --dot:139,125,255;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b0e1a; --bg2:#121735; --card:rgba(22,27,52,.62); --card-solid:#161b34; --text:#e8ebff; --muted:#9aa3c7;
      --line:rgba(255,255,255,.09); --input:rgba(10,13,28,.6);
      --accent:#8b7dff; --accent2:#38d0ff; --ok:#3ddc84; --err:#ff6b70;
      --ok-bg:rgba(61,220,132,.13); --err-bg:rgba(255,107,112,.14); --win-bg:rgba(250,204,21,.13);
      --shadow:0 16px 40px -16px rgba(0,0,0,.6); --dot:139,125,255;
    }
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body { margin:0; font:15px/1.55 Manrope, system-ui, "Segoe UI", sans-serif; color:var(--text);
         background:radial-gradient(1200px 600px at 10% -10%, var(--bg2), transparent 60%),
                    radial-gradient(900px 500px at 110% 10%, var(--bg2), transparent 60%), var(--bg);
         background-attachment:fixed; transition:background-color .3s, color .3s; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .page { position:relative; z-index:1; }

  header { position:sticky; top:0; z-index:5; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           background:var(--card); border-bottom:1px solid var(--line); }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px; }
  nav { display:flex; gap:4px; align-items:center; flex-wrap:wrap; min-height:62px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; margin-right:18px; letter-spacing:-.01em; }
  .brand svg { width:30px; height:30px; }
  nav a { color:var(--muted); text-decoration:none; padding:7px 13px; border-radius:9px; font-weight:600;
          transition:color .2s, background .2s; }
  nav a:hover { color:var(--text); background:var(--line); }
  nav a.on { color:var(--text); background:linear-gradient(135deg, rgba(var(--dot),.18), rgba(var(--dot),.06)); }
  .nav-right { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line);
              background:var(--input); color:var(--text); cursor:pointer; padding:0; transition:transform .2s; }
  .icon-btn:hover { transform:rotate(-12deg) scale(1.05); }
  .icon-btn svg { width:18px; height:18px; }
  .i-sun { display:none; }
  :root[data-theme="dark"] .i-sun { display:block; } :root[data-theme="dark"] .i-moon { display:none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .i-sun { display:block; } :root:not([data-theme="light"]) .i-moon { display:none; }
  }

  main { padding:28px 0 56px; }
  h1 { font-size:26px; margin:0 0 18px; letter-spacing:-.02em; font-weight:800; }
  h2 { font-size:17px; margin:0 0 14px; font-weight:700; }
  .card { background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
          border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:20px; box-shadow:var(--shadow);
          animation:rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .card:nth-of-type(2) { animation-delay:.05s; } .card:nth-of-type(3) { animation-delay:.1s; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .grid { display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  .grid > .card { margin-bottom:0; }
  .grid { margin-bottom:20px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } h1 { font-size:22px; } }

  label { display:block; font-weight:700; margin:14px 0 6px; font-size:14px; }
  .hint { color:var(--muted); font-size:13px; font-weight:500; }
  input[type=text], input[type=password], select, textarea {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit;
    background:var(--input); color:var(--text); transition:border-color .2s, box-shadow .2s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(var(--dot),.18); }
  input[type=file] { font:inherit; color:var(--muted); }
  textarea { min-height:96px; resize:vertical; }
  select option { background:var(--card-solid); }

  button, .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border:0; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font:inherit; font-weight:700;
    cursor:pointer; text-decoration:none; box-shadow:0 6px 18px -8px rgba(var(--dot),.8);
    transition:transform .15s, box-shadow .2s, filter .2s; }
  button:hover, .btn:hover { transform:translateY(-1px); filter:brightness(1.07); }
  button:active, .btn:active { transform:translateY(0); }
  .btn.sm, button.sm { padding:5px 11px; font-size:13px; border-radius:8px; }
  .btn.ghost, button.ghost { background:var(--input); color:var(--text); border:1px solid var(--line); box-shadow:none; }
  .btn.ok, button.ok { background:linear-gradient(135deg, #12a150, #2fd67a); box-shadow:0 6px 18px -8px rgba(18,161,80,.8); }
  .btn.danger, button.danger { background:linear-gradient(135deg, #e5484d, #ff7a59); box-shadow:0 6px 18px -8px rgba(229,72,77,.8); }

  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  form.inline { display:inline; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  tbody tr, table tr { transition:background .2s; }
  tr:hover td { background:rgba(var(--dot),.05); }
  .table-scroll { overflow-x:auto; }
  tr.win td { background:var(--win-bg); }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; vertical-align:middle; }
  .badge.active { background:var(--ok-bg); color:var(--ok); }
  .badge.closed { background:var(--line); color:var(--muted); }
  .flash { padding:12px 16px; border-radius:12px; margin-bottom:18px; font-weight:600; animation:rise .35s both;
           border:1px solid var(--line); }
  .flash.ok { background:var(--ok-bg); color:var(--ok); }
  .flash.err { background:var(--err-bg); color:var(--err); }
  .muted { color:var(--muted); }
  .mono { font-family:ui-monospace, "Cascadia Code", Consolas, monospace; font-size:13px; }
  a { color:var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="page">
{% set authed = request.session.get('auth') %}
<header><div class="wrap"><nav>
  <span class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="url(#lg)"/>
      <path d="M12.2 12.4a3.9 3.9 0 1 1 5.6 3.5c-1.1.5-1.8 1.4-1.8 2.6v.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="16" cy="23" r="1.6" fill="#fff"/>
    </svg>
    Viktorina
  </span>
  {% if authed %}
  {% set p = request.url.path %}
  <a href="/" class="{{ 'on' if p == '/' or p.startswith('/quiz') }}">Viktorinalar</a>
  <a href="/qa" class="{{ 'on' if p.startswith('/qa') }}">Savol-javob</a>
  <a href="/texts" class="{{ 'on' if p == '/texts' }}">Bot matnlari</a>
  <a href="/admins" class="{{ 'on' if p == '/admins' }}">Adminlar</a>
  <a href="/channels" class="{{ 'on' if p == '/channels' }}">Kanallar</a>
  {% endif %}
  <div class="nav-right">
    <button type="button" class="icon-btn" id="themeBtn" title="Mavzuni almashtirish" aria-label="Mavzuni almashtirish">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    {% if authed %}<a href="/password" class="{{ 'on' if request.url.path == '/password' }}">🔑 Parol</a><a href="/logout">Chiqish</a>{% endif %}
  </div>
</nav></div></header>
<main><div class="wrap">
  {% if flash %}<div class="flash {{ flash[0] }}">{{ flash[1] }}</div>{% endif %}
  {% block content %}{% endblock %}
</div></main>
</div>

<script>
// --- Mavzu almashtirgich ---
(() => {
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark"
                                          : matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("themeBtn").addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
})();

// --- Sichqonchaga javob beradigan bog'langan nuqtalar foni ---
(() => {
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mouse = { x: -9999, y: -9999, active: false };
  const LINK = 140, MOUSE_R = 190;
  let w, h, dpr, pts = [];

  function color() {
    return getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || "109,94,252";
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(240, Math.max(60, (w * h) / 6000)));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45,
      r: Math.random() * 1.6 + 1.1,
    }));
  }
  addEventListener("resize", resize);
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  addEventListener("pointerleave", () => { mouse.active = false; mouse.x = mouse.y = -9999; });
  document.addEventListener("mouseleave", () => { mouse.active = false; mouse.x = mouse.y = -9999; });

  function frame() {
    const rgb = color();
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      // Sichqoncha nuqtalarni yumshoq tortadi
      const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
      if (d < MOUSE_R && d > 1) {
        const f = (1 - d / MOUSE_R) * .06;
        p.vx += dx / d * f; p.vy += dy / d * f;
      }
      p.vx *= .985; p.vy *= .985;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp < .15) { p.vx += (Math.random() - .5) * .05; p.vy += (Math.random() - .5) * .05; }
      if (sp > 2.2) { p.vx *= 2.2 / sp; p.vy *= 2.2 / sp; }
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      p.x = Math.max(0, Math.min(w, p.x)); p.y = Math.max(0, Math.min(h, p.y));
    }
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < LINK) {
          ctx.strokeStyle = `rgba(${rgb},${(1 - d / LINK) * .35})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      if (mouse.active) {
        const d = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (d < MOUSE_R) {
          ctx.strokeStyle = `rgba(${rgb},${(1 - d / MOUSE_R) * .6})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }
      ctx.fillStyle = `rgba(${rgb},.75)`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  resize();
  frame();
})();
</script>
</body>
</html>
